- id: "1791998632227"
  alias: "Benachrichtigung: Solltemperatur geändert"
  description:
    Sendet eine Benachrichtigung bei Änderung von Komfort-, Normal- oder
    Reduzierter Temperatur.
  triggers:
    - entity_id:
        - number.vito_hk2_komforttemperatur
        - number.vito_hk2_normaltemperatur
        - number.vito_hk2_reduzierte_temperatur
      trigger: state
  conditions:
    - condition: template
      value_template:
        "{{ trigger.from_state.state not in ['unknown', 'unavailable',
        ''] and trigger.to_state.state not in ['unknown', 'unavailable', '']
        }}"
  actions:
    - action: notify.mobile_app_simons_pixel_9a
      data:
        title: "\U0001F321️ Temperaturanpassung"
        message:
          "{{ trigger.to_state.attributes.friendly_name | default(trigger.entity_id)
          }} wurde geändert: von {{ trigger.from_state.state }} °C auf {{ trigger.to_state.state
          }} °C."
