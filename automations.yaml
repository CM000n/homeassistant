- id: "1790446724329"
  alias: Dachfenster - Warnung bei Regen und Abwesenheit
  description:
    Benachrichtigt Lisa und Simon in einer konsolidierten Nachricht, wenn
    Dachfenster offen sind, die Regenwahrscheinlichkeit über 40% liegt und beide nicht
    zuhause sind.
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.myggbett_door_window_sensor_tur
        - binary_sensor.myggbett_door_window_sensor_tur_2
      to: "on"
    - trigger: numeric_state
      entity_id: sensor.kraichtal_gochsheim_niederschlagswahrscheinlichkeit
      above: 40
    - trigger: state
      entity_id:
        - person.simon
        - person.lisa
      from: home
  conditions:
    - condition: not
      conditions:
        - condition: state
          entity_id: person.simon
          state: home
    - condition: not
      conditions:
        - condition: state
          entity_id: person.lisa
          state: home
    - condition: numeric_state
      entity_id: sensor.kraichtal_gochsheim_niederschlagswahrscheinlichkeit
      above: 40
    - condition: or
      conditions:
        - condition: state
          entity_id: binary_sensor.myggbett_door_window_sensor_tur
          state: "on"
        - condition: state
          entity_id: binary_sensor.myggbett_door_window_sensor_tur_2
          state: "on"
  actions:
    - variables:
        offene_fenster:
          "{% set ns = namespace(items=[]) %}{% if states('binary_sensor.myggbett_door_window_sensor_tur')
          == 'on' %}{% set ns.items = ns.items + ['Büro'] %}{% endif %}{% if states('binary_sensor.myggbett_door_window_sensor_tur_2')
          == 'on' %}{% set ns.items = ns.items + ['Bad'] %}{% endif %}{{ ns.items
          | join(', ') }}"
        regenwahrscheinlichkeit:
          "{{ states('sensor.kraichtal_gochsheim_niederschlagswahrscheinlichkeit')
          }}"
    - action: notify.mobile_app_simons_pixel_9a
      data:
        title: "\U0001F327️ Dachfenster offen – Regen möglich"
        message:
          "Regenwahrscheinlichkeit {{ regenwahrscheinlichkeit }}%. Offene Dachfenster:
          {{ offene_fenster }}. Bitte schließen!"
    - action: notify.mobile_app_lisas_pixel_9a
      data:
        title: "\U0001F327️ Dachfenster offen – Regen möglich"
        message:
          "Regenwahrscheinlichkeit {{ regenwahrscheinlichkeit }}%. Offene Dachfenster:
          {{ offene_fenster }}. Bitte schließen!"
    - action: notify.mobile_app_simon_ipad
      data:
        title: "\U0001F327️ Dachfenster offen – Regen möglich"
        message:
          "Regenwahrscheinlichkeit {{ regenwahrscheinlichkeit }}%. Offene Dachfenster:
          {{ offene_fenster }}. Bitte schließen!"
  mode: single
