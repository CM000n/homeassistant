# Kopplung Vitotronic (HK2 Heizkörper) -> Advanced Heating Control V5 (Heizkörperthermostate in Bad und Büro).
# Package: wird über `packages: !include_dir_named "integrations"` geladen.
#
# Die Vitotronic ist die Quelle der Wahrheit, AHC liest nur. Es wird nichts in den Regler zurückgeschrieben
# (UI-/Physical-Sync von AHC bleibt aus, sonst ginge jede Änderung am Thermostat in den EEPROM des Reglers).
#
#   Vitotronic                                          AHC (Blueprint-Eingang)
#   --------------------------------------------------  --------------------------------------------------
#   Solltemperatur Normal                            -> input_number.heizplan_hk2_normaltemperatur   (Comfort Temperature)
#   Solltemperatur Reduziert                         -> input_number.heizplan_hk2_reduzierte_temperatur (Eco Temperature)
#   Betrieb 2: Komfortbetrieb / Dauernd Tagbetrieb   -> binary_sensor.heizplan_hk2_party              (Party mode)
#   Betrieb 1: Sparbetrieb / Dauernd reduziert /
#     Urlaubsprogramm                                -> binary_sensor.heizplan_hk2_eco_erzwungen      (Force Eco Temperature)
#   Betriebsart Aus / Nur Warmwasser aktiv           -> binary_sensor.heizplan_hk2_heizen_freigegeben (Winter Mode / Automation Toggle)
#   Zeitprogramm (Schedule-Helper, zweiseitig)       -> schedule.vito_heizkreis_2_heizkorper_zeitprogramm (Schedules, unverändert)
#
# Warum Spiegel-input_numbers: die AHC-Auswahlfelder für die Temperaturen akzeptieren nur input_number. Der Spiegel
# entkoppelt die Räume außerdem vom Regler: ist MQTT oder der Pi weg, werden die number-Entitäten unavailable, ein
# input_number behält seinen letzten Wert und AHC rechnet weiter (mit `float` ohne Default würde es sonst abbrechen).
#
# Die Komfort-Temperatur der Party kommt über den Namen: AHC liest die Zahl am Ende des Anzeigenamens als Party-Temperatur
# ("Heizplan HK2 Party 22"). Bei Dauernd Tagbetrieb steht keine Zahl im Namen, dann gilt die Normaltemperatur.

input_number:
  heizplan_hk2_normaltemperatur:
    name: "Heizplan HK2 Normaltemperatur (Spiegel der Vitotronic)"
    min: 3
    max: 37
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer
  heizplan_hk2_reduzierte_temperatur:
    name: "Heizplan HK2 Reduzierte Temperatur (Spiegel der Vitotronic)"
    min: 3
    max: 37
    step: 0.5
    unit_of_measurement: "°C"
    mode: box
    icon: mdi:thermometer-low

template:
  - binary_sensor:
      # Komfortbetrieb hat Vorrang vor Dauernd Tagbetrieb: nur dann steht die Komfort-Temperatur im Namen
      - name: >-
          {% set t = states('number.vito_hk2_komforttemperatur') | float(none) -%}
          Heizplan HK2 Party{{ ' ' ~ (t | int) if t is not none and is_state('switch.vito_hk2_komfortbetrieb', 'on') else '' }}
        unique_id: "5b0c7d1e-3a64-4f0b-9c21-8e7a4d6f1b02"
        icon: mdi:party-popper
        state: >-
          {{ is_state('switch.vito_hk2_komfortbetrieb', 'on')
             or is_state('select.vito_hk2_betriebsart', 'Dauernd Tagbetrieb') }}

      # Party hat in AHC Vorrang vor "Force Eco", wie Komfortbetrieb in der Vitotronic den Sparbetrieb beendet
      - name: "Heizplan HK2 Eco erzwungen"
        unique_id: "c91e4a37-6d85-4b2f-a0d3-2f5b8e9c7a14"
        icon: mdi:leaf
        state: >-
          {{ is_state('switch.vito_hk2_sparbetrieb', 'on')
             or is_state('select.vito_hk2_betriebsart', 'Dauernd reduziert')
             or is_state('binary_sensor.vito_urlaubsprogramm', 'on') }}

      # unavailable/unknown zählt als "Heizung aktiv": fällt der Regler aus, bleiben die Räume im Zeitplan
      - name: "Heizplan HK2 Heizen freigegeben"
        unique_id: "e2a8f6b4-19c3-47d0-8b5e-6d1c3a9f4e27"
        icon: mdi:radiator
        state: >-
          {{ is_state('binary_sensor.heizperiode_freigabe', 'on')
             and states('select.vito_hk2_betriebsart') not in ['Aus', 'Nur Warmwasser aktiv'] }}

automation:
  # Einseitig: Vitotronic (Quelle) -> Spiegel. Eine Änderung von Hand am Spiegel wird sofort zurückgesetzt, so kann er
  # nicht still von der Vitotronic abweichen. unavailable/unknown der Quelle wird ignoriert (Spiegel behält den Wert).
  - id: heizplan_vito_temperaturen_spiegeln
    alias: "Heizplan: Vitotronic-Solltemperaturen für AHC spiegeln"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - number.vito_hk2_normaltemperatur
          - number.vito_hk2_reduzierte_temperatur
          - input_number.heizplan_hk2_normaltemperatur
          - input_number.heizplan_hk2_reduzierte_temperatur
      - trigger: homeassistant
        event: start
    actions:
      - repeat:
          for_each:
            - src: number.vito_hk2_normaltemperatur
              dst: input_number.heizplan_hk2_normaltemperatur
            - src: number.vito_hk2_reduzierte_temperatur
              dst: input_number.heizplan_hk2_reduzierte_temperatur
          sequence:
            - if:
                - condition: template
                  value_template: >-
                    {% set v = states(repeat.item.src) | float(none) %}
                    {{ v is not none and (states(repeat.item.dst) | float(none)) != v }}
              then:
                - action: input_number.set_value
                  target:
                    entity_id: "{{ repeat.item.dst }}"
                  data:
                    value: "{{ states(repeat.item.src) | float }}"
