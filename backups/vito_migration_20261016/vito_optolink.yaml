---
# Abgeleitete Entities zur lokalen Optolink-Anbindung (optolink-splitter -> MQTT-Discovery).
# Die Rohdaten kommen als sensor.vito_* / binary_sensor.vito_* aus der MQTT-Discovery des Splitters
# (Quelle: Raspberry Pi 192.168.176.8, ~/optolink-splitter/homeassistant_poll_list.py).
# Hier stehen nur Werte, die der Regler nicht selbst liefert und die die ViCare-Integration bisher berechnet hat:
# Brenner-Statistik, Laufzeiten, Heizkurven-Soll, Zeitprogramm-Status. Reine Lese-Auswertung, keine Schreibzugriffe.

sensor:
  # ---------------------------------------------------------------- Brenner-Statistik (aus binary_sensor.vito_brenner_aktiv)
  - platform: "history_stats"
    name: "Vito Brenner Starts letzte Stunde"
    unique_id: "vito_brenner_starts_letzte_stunde"
    entity_id: "binary_sensor.vito_brenner_aktiv"
    state: "on"
    type: "count"
    start: "{{ now() - timedelta(hours=1) }}"
    end: "{{ now() }}"

  - platform: "history_stats"
    name: "Vito Brenner Starts heute"
    unique_id: "vito_brenner_starts_heute"
    entity_id: "binary_sensor.vito_brenner_aktiv"
    state: "on"
    type: "count"
    start: &vito_heute_start "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: &vito_heute_ende "{{ now() }}"

  # ---------------------------------------------------------------- Laufzeit heute (Brenner + Pumpen)
  - platform: "history_stats"
    name: "Vito Brenner Laufzeit heute"
    unique_id: "vito_brenner_laufzeit_heute"
    entity_id: "binary_sensor.vito_brenner_aktiv"
    state: "on"
    type: "time"
    start: *vito_heute_start
    end: *vito_heute_ende

  - platform: "history_stats"
    name: "Vito Interne Kesselpumpe Laufzeit heute"
    unique_id: "vito_interne_kesselpumpe_laufzeit_heute"
    entity_id: "binary_sensor.vito_interne_kesselpumpe"
    state: "on"
    type: "time"
    start: *vito_heute_start
    end: *vito_heute_ende

  - platform: "history_stats"
    name: "Vito HK1 Pumpe Laufzeit heute"
    unique_id: "vito_hk1_pumpe_laufzeit_heute"
    entity_id: "binary_sensor.vito_hk1_pumpe"
    state: "on"
    type: "time"
    start: *vito_heute_start
    end: *vito_heute_ende

  - platform: "history_stats"
    name: "Vito HK2 Pumpe Laufzeit heute"
    unique_id: "vito_hk2_pumpe_laufzeit_heute"
    entity_id: "binary_sensor.vito_hk2_pumpe"
    state: "on"
    type: "time"
    start: *vito_heute_start
    end: *vito_heute_ende

  - platform: "history_stats"
    name: "Vito Warmwasser Ladepumpe Laufzeit heute"
    unique_id: "vito_warmwasser_ladepumpe_laufzeit_heute"
    entity_id: "binary_sensor.vito_warmwasser_ladepumpe"
    state: "on"
    type: "time"
    start: *vito_heute_start
    end: *vito_heute_ende

  - platform: "history_stats"
    name: "Vito Zirkulationspumpe Laufzeit heute"
    unique_id: "vito_zirkulationspumpe_laufzeit_heute"
    entity_id: "binary_sensor.vito_zirkulationspumpe"
    state: "on"
    type: "time"
    start: *vito_heute_start
    end: *vito_heute_ende

  - platform: "history_stats"
    name: "Vito Solarpumpe Laufzeit heute"
    unique_id: "vito_solarpumpe_laufzeit_heute"
    entity_id: "binary_sensor.vito_solarpumpe"
    state: "on"
    type: "time"
    start: *vito_heute_start
    end: *vito_heute_ende

template:
  # ---------------------------------------------------------------- Brenner: Taktung, mittlere Laufzeit
  - binary_sensor:
      - name: "Vito Brenner Taktung"
        unique_id: "vito_brenner_taktung"
        device_class: "problem"
        state: "{{ states('sensor.vito_brenner_starts_letzte_stunde') | int(0) >= 4 }}"
        availability: "{{ states('sensor.vito_brenner_starts_letzte_stunde') not in ['unknown', 'unavailable'] }}"
        attributes:
          starts_letzte_stunde: "{{ states('sensor.vito_brenner_starts_letzte_stunde') }}"
          schwelle: 4

  - sensor:
      - name: "Vito Brenner Ø Laufzeit pro Start"
        unique_id: "vito_brenner_laufzeit_pro_start"
        unit_of_measurement: "min"
        device_class: "duration"
        state_class: "measurement"
        # Lebenszeit-Mittel (Betriebsstunden / Starts), wie bisher in der ViCare-Integration
        state: >-
          {% set h = states('sensor.vito_brennerlaufzeit') | float(none) %}
          {% set s = states('sensor.vito_brennerstarts') | float(none) %}
          {{ ((h * 60 / s) | round(1)) if (h is not none and s) else none }}

  # ---------------------------------------------------------------- Brenner: letzte Laufzeit / letzte Pause (Flanken von binary_sensor.vito_brenner_aktiv)
  - trigger:
      - trigger: "state"
        entity_id: "binary_sensor.vito_brenner_aktiv"
        from: "on"
        to: "off"
    sensor:
      - name: "Vito Brenner letzte Laufzeit"
        unique_id: "vito_brenner_letzte_laufzeit"
        unit_of_measurement: "min"
        device_class: "duration"
        state: "{{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(1) }}"

  - trigger:
      - trigger: "state"
        entity_id: "binary_sensor.vito_brenner_aktiv"
        from: "off"
        to: "on"
    sensor:
      - name: "Vito Brenner letzte Pause"
        unique_id: "vito_brenner_letzte_pause"
        unit_of_measurement: "min"
        device_class: "duration"
        state: "{{ ((now() - trigger.from_state.last_changed).total_seconds() / 60) | round(1) }}"

  # ---------------------------------------------------------------- Heizkurve: Soll-Vorlauf und Abweichung (gleiche Formel wie bisher in der ViCare-Integration)
  - sensor:
      - name: "Vito HK1 Soll-Vorlauftemperatur Heizkurve"
        unique_id: "vito_hk1_soll_vorlauftemperatur_heizkurve"
        unit_of_measurement: "°C"
        device_class: "temperature"
        state_class: "measurement"
        state: >-
          {% set out = states('sensor.vito_aussentemperatur') | float(none) %}
          {% set rs = states('sensor.vito_hk1_raumsolltemperatur_aktuell') | float(0) %}
          {% set room = rs if rs >= 5 else states('sensor.vito_hk1_normaltemperatur') | float(none) %}
          {% set slope = states('sensor.vito_hk1_heizkurve_steigung') | float(none) %}
          {% set shift = states('sensor.vito_hk1_heizkurve_niveau') | float(none) %}
          {% if out is not none and room is not none and slope is not none and shift is not none %}
            {% set d = out - room %}
            {{ (room + shift - slope * d * (1.4347 + 0.021 * d + 0.0002479 * d * d)) | round(1) }}
          {% else %}{{ none }}{% endif %}
      - name: "Vito HK2 Soll-Vorlauftemperatur Heizkurve"
        unique_id: "vito_hk2_soll_vorlauftemperatur_heizkurve"
        unit_of_measurement: "°C"
        device_class: "temperature"
        state_class: "measurement"
        state: >-
          {% set out = states('sensor.vito_aussentemperatur') | float(none) %}
          {% set rs = states('sensor.vito_hk2_raumsolltemperatur_aktuell') | float(0) %}
          {% set room = rs if rs >= 5 else states('sensor.vito_hk2_normaltemperatur') | float(none) %}
          {% set slope = states('sensor.vito_hk2_heizkurve_steigung') | float(none) %}
          {% set shift = states('sensor.vito_hk2_heizkurve_niveau') | float(none) %}
          {% if out is not none and room is not none and slope is not none and shift is not none %}
            {% set d = out - room %}
            {{ (room + shift - slope * d * (1.4347 + 0.021 * d + 0.0002479 * d * d)) | round(1) }}
          {% else %}{{ none }}{% endif %}
      - name: "Vito HK1 Vorlauf Abweichung zur Heizkurve"
        unique_id: "vito_hk1_vorlauf_abweichung_zur_heizkurve"
        unit_of_measurement: "K"
        state_class: "measurement"
        state: >-
          {% set v = states('sensor.vito_hk1_vorlauftemperatur') | float(none) %}
          {% set t = states('sensor.vito_hk1_soll_vorlauftemperatur_heizkurve') | float(none) %}
          {{ ((v - t) | round(1)) if (v is not none and t is not none) else none }}
      - name: "Vito HK2 Vorlauf Abweichung zur Heizkurve"
        unique_id: "vito_hk2_vorlauf_abweichung_zur_heizkurve"
        unit_of_measurement: "K"
        state_class: "measurement"
        state: >-
          {% set v = states('sensor.vito_hk2_vorlauftemperatur') | float(none) %}
          {% set t = states('sensor.vito_hk2_soll_vorlauftemperatur_heizkurve') | float(none) %}
          {{ ((v - t) | round(1)) if (v is not none and t is not none) else none }}

  # ---------------------------------------------------------------- Heizkreis-Programm (aktiv): aus Betriebsart + Zeitprogramm
  # Betriebsart Standby/Nur Warmwasser -> standby, dauernd reduziert -> reduced, dauernd normal -> normal,
  # Heizen und Warmwasser -> Zustand des Zeitprogramms (normal/reduced).
  - sensor:
      - name: "Vito HK1 Programm"
        unique_id: "vito_hk1_programm"
        state: >-
          {% if is_state('binary_sensor.vito_hk1_betriebsart_dauernd_normal', 'on') %}normal
          {% elif is_state('binary_sensor.vito_hk1_betriebsart_dauernd_reduziert', 'on') %}reduced
          {% elif is_state('binary_sensor.vito_hk1_betriebsart_heizen_warmwasser', 'on') %}{{ states('sensor.vito_hk1_zeitprogramm') }}
          {% elif is_state('binary_sensor.vito_hk1_betriebsart_standby', 'on') or is_state('binary_sensor.vito_hk1_betriebsart_warmwasser', 'on') %}standby
          {% else %}{{ none }}{% endif %}
      - name: "Vito HK2 Programm"
        unique_id: "vito_hk2_programm"
        state: >-
          {% if is_state('binary_sensor.vito_hk2_betriebsart_dauernd_normal', 'on') %}normal
          {% elif is_state('binary_sensor.vito_hk2_betriebsart_dauernd_reduziert', 'on') %}reduced
          {% elif is_state('binary_sensor.vito_hk2_betriebsart_heizen_warmwasser', 'on') %}{{ states('sensor.vito_hk2_zeitprogramm') }}
          {% elif is_state('binary_sensor.vito_hk2_betriebsart_standby', 'on') or is_state('binary_sensor.vito_hk2_betriebsart_warmwasser', 'on') %}standby
          {% else %}{{ none }}{% endif %}

  # ---------------------------------------------------------------- Solar: Temperaturdifferenz Kollektor / Speicher
  - sensor:
      - name: "Vito Solar Temperaturdifferenz Kollektor Speicher"
        unique_id: "vito_solar_temperaturdifferenz_kollektor_speicher"
        unit_of_measurement: "K"
        state_class: "measurement"
        state: >-
          {% set k = states('sensor.vito_solar_kollektortemperatur') | float(none) %}
          {% set s = states('sensor.vito_solar_speichertemperatur') | float(none) %}
          {{ ((k - s) | round(1)) if (k is not none and s is not none) else none }}

  # ---------------------------------------------------------------- Zeitprogramme: aktueller Zustand aus den Schaltzeiten des Reglers
  # Rohdaten: 7 Tage (Mo..So) x 8 Byte = 4 Paare (Ein, Aus); Byte = Stunde*8 + Minute/10; 0xFF = ungenutzt.
  # Der Splitter liefert max. 55 Byte pro Read: das letzte Byte (So, 4. Slot, Aus-Zeit) fehlt und zaehlt als ungenutzt.
  - sensor:
      - name: "Vito HK1 Zeitprogramm"
        unique_id: "vito_hk1_zeitprogramm"
        state: >-
          {% set h = states('sensor.vito_hk1_zeitprogramm_roh') %}
          {% if h | length < 110 %}{{ none }}{% else %}
          {% set n = now() %}{% set cur = n.hour * 60 + n.minute %}{% set ns = namespace(on=false) %}
          {% for i in range(4) %}
          {% set a = (n.weekday() * 8 + i * 2) * 2 %}
          {% set o = h[a:a+2] | int(255, 16) %}{% set c = h[a+2:a+4] | int(255, 16) %}
          {% if o != 255 and c != 255 and ((o // 8) * 60 + (o % 8) * 10) <= cur and cur < ((c // 8) * 60 + (c % 8) * 10) %}{% set ns.on = true %}{% endif %}
          {% endfor %}
          {{ 'normal' if ns.on else 'reduced' }}{% endif %}
      - name: "Vito HK2 Zeitprogramm"
        unique_id: "vito_hk2_zeitprogramm"
        state: >-
          {% set h = states('sensor.vito_hk2_zeitprogramm_roh') %}
          {% if h | length < 110 %}{{ none }}{% else %}
          {% set n = now() %}{% set cur = n.hour * 60 + n.minute %}{% set ns = namespace(on=false) %}
          {% for i in range(4) %}
          {% set a = (n.weekday() * 8 + i * 2) * 2 %}
          {% set o = h[a:a+2] | int(255, 16) %}{% set c = h[a+2:a+4] | int(255, 16) %}
          {% if o != 255 and c != 255 and ((o // 8) * 60 + (o % 8) * 10) <= cur and cur < ((c // 8) * 60 + (c % 8) * 10) %}{% set ns.on = true %}{% endif %}
          {% endfor %}
          {{ 'normal' if ns.on else 'reduced' }}{% endif %}
      - name: "Vito Warmwasser Zeitprogramm"
        unique_id: "vito_warmwasser_zeitprogramm"
        state: >-
          {% set h = states('sensor.vito_warmwasser_zeitprogramm_roh') %}
          {% if h | length < 110 %}{{ none }}{% else %}
          {% set n = now() %}{% set cur = n.hour * 60 + n.minute %}{% set ns = namespace(on=false) %}
          {% for i in range(4) %}
          {% set a = (n.weekday() * 8 + i * 2) * 2 %}
          {% set o = h[a:a+2] | int(255, 16) %}{% set c = h[a+2:a+4] | int(255, 16) %}
          {% if o != 255 and c != 255 and ((o // 8) * 60 + (o % 8) * 10) <= cur and cur < ((c // 8) * 60 + (c % 8) * 10) %}{% set ns.on = true %}{% endif %}
          {% endfor %}
          {{ 'on' if ns.on else 'off' }}{% endif %}
      - name: "Vito Zirkulation Zeitprogramm"
        unique_id: "vito_zirkulation_zeitprogramm"
        state: >-
          {% set h = states('sensor.vito_zirkulation_zeitprogramm_roh') %}
          {% if h | length < 110 %}{{ none }}{% else %}
          {% set n = now() %}{% set cur = n.hour * 60 + n.minute %}{% set ns = namespace(on=false) %}
          {% for i in range(4) %}
          {% set a = (n.weekday() * 8 + i * 2) * 2 %}
          {% set o = h[a:a+2] | int(255, 16) %}{% set c = h[a+2:a+4] | int(255, 16) %}
          {% if o != 255 and c != 255 and ((o // 8) * 60 + (o % 8) * 10) <= cur and cur < ((c // 8) * 60 + (c % 8) * 10) %}{% set ns.on = true %}{% endif %}
          {% endfor %}
          {{ 'on' if ns.on else 'off' }}{% endif %}
