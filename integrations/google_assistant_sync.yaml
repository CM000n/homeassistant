# Google Assistant: Geräteliste automatisch bei Google aktualisieren.
#
# `google_assistant.request_sync` sagt Google, dass sich Geräte, Namen oder Räume geändert
# haben. Ohne Sync tauchen neue Entities oder geänderte Bereiche erst nach einem manuellen
# Sync in der Google-Home-App auf. `agent_user_id` ist die HA-Benutzer-ID, die mit Google
# verknüpft ist (Simon).
#
# Ausgelöst wird nach dem HA-Start und bei jeder Änderung in der Entity-Registry (neu,
# umbenannt, anderer Bereich). Die Wartezeit mit `mode: restart` fasst mehrere Änderungen in
# kurzer Folge zu einem Sync zusammen und vermeidet 429-Fehler von Google. Fehler von Google
# (404, 429) stehen im HA-Log unter `homeassistant.components.google_assistant.http`.

automation:
  - id: google_assistant_request_sync
    alias: "Google Assistant: Geräte synchronisieren"
    description: "Löst nach HA-Start und bei Änderungen in der Entity-Registry einen Sync bei Google aus."
    mode: restart
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: entity_registry_updated
        event_data:
          action: create
      - trigger: event
        event_type: entity_registry_updated
        event_data:
          action: update
    actions:
      - delay: "00:02:00"
      - action: google_assistant.request_sync
        data:
          agent_user_id: "3fb4deff931c4631b84d2584e5f2e493"
